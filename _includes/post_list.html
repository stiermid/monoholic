<ul class="post-list">
  {%- for post in site.posts -%}
    <li>
      <span class="post-meta">
        {% assign _date_fmt = site.theme_config.date_format
          | default: '%Y-%m-%d'
        %}
        * {{ post.date | date: _date_fmt }}
      </span>
      <a href="{{ post.url | relative_url }}">
        {{ post.title | escape }}
      </a>
    </li>
  {%- endfor -%}
</ul>
